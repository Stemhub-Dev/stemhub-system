global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    server: stemhub-server

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: stemhub-server

  - job_name: cadvisor
    static_configs:
      - targets: ["127.0.0.1:8098"]
        labels:
          instance: stemhub-server

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          instance: stemhub-server
