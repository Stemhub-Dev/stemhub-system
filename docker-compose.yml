name: stemhub-system

# Compose de DESARROLLO LOCAL: construye cada servicio desde el checkout
# local de su subrepo y usa Supabase local (Auth/GoTrue), levantado aparte
# con "npx supabase start" (ver up.sh). Standalone — no requiere "-f".
#
# El equivalente de PRODUCCIÓN es docker-compose.prod.yml: mismos servicios,
# pero con "image: ghcr.io/stemhub-dev/*" en vez de "build:", y sin la red
# de Supabase local (usa Supabase Cloud). Ver deploy.sh.
#
# Dev:  docker compose up -d --build   (usa up.sh)
# Prod: docker compose -f docker-compose.prod.yml --env-file .env.production up -d   (usa deploy.sh)

services:

  postgres:
    image: postgres:17
    container_name: stemhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - stemhub_postgres_data:/var/lib/postgresql/data
      - ./Stem-Hub-BackEnd/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    # minio/minio se retiró de Docker Hub el 2026-09-11 (repo community
    # archivado, distribución solo vía quay.io ahora, mismos tags).
    image: quay.io/minio/minio:latest
    container_name: stemhub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stemhub_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ml-spleeter-worker:
    build:
      context: ./stemhub-microservicio-IA/spleeter_worker
      dockerfile: Dockerfile
      # Para build con soporte GPU, descomentar:
      # args:
      #   BASE_IMAGE: tensorflow/tensorflow:2.5.0-gpu
    container_name: stemhub-ml-spleeter-worker
    restart: unless-stopped
    # Requiere driver NVIDIA propietario + nvidia-container-toolkit en el
    # host, y build/imagen con soporte GPU (ver arriba).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ml_tmp_data:/shared-tmp
      - ml_spleeter_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ml-service:
    build:
      context: ./stemhub-microservicio-IA
      dockerfile: Dockerfile
    container_name: stemhub-ml-service
    restart: unless-stopped
    environment:
      APP_PORT: 8000
      SPLEETER_WORKER_URL: http://ml-spleeter-worker:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_API_BASE_URL: ${QWEN_API_BASE_URL}
      QWEN_MODEL: ${QWEN_MODEL:-qwen2.5-7b-instruct}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-stemhub-audio}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    volumes:
      - ml_tmp_data:/shared-tmp
    depends_on:
      ml-spleeter-worker:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./Stem-Hub-BackEnd
      dockerfile: Dockerfile
    container_name: stemhub-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PORT: 8080
      # SUPABASE_URL debe ser la URL pública que también usa el
      # navegador/frontend: es contra ese valor que se valida el claim "iss"
      # del token. La Supabase CLI local siempre emite tokens con
      # iss=http://127.0.0.1:54321 (no configurable), así que el JWKS se
      # descarga por un camino de red distinto (ver "networks" abajo) — ver
      # Stem-Hub-BackEnd/supabase/README.md para el detalle completo.
      SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_AUDIENCE: ${SUPABASE_AUDIENCE:-authenticated}
      SUPABASE_JWKS_BASE_URL: ${SUPABASE_JWKS_BASE_URL:-http://kong:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Storage de audio, compartido con el bucket que ya usa ml-service.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-stemhub-audio}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # Host con el que el NAVEGADOR (no el backend) resuelve las URLs
      # presignadas de descarga/reproducción de audio. MINIO_ENDPOINT
      # ("minio:9000") solo es resoluble dentro de la red de Docker.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      # SMTP para el mail de invitación a proyecto, enviado directamente por
      # el backend Go (no pasa por GoTrue/auth.email.smtp). En dev local
      # apunta a Inbucket (ver Stem-Hub-BackEnd/supabase/config.toml,
      # [local_smtp]) para no mandar mails reales. Este contenedor corre
      # dentro de la red de Docker que crea "npx supabase start" (ver
      # "networks" abajo), así que se conecta directo al contenedor de
      # Inbucket por su nombre y su puerto SMTP INTERNO (1025) — no por
      # "127.0.0.1:54325", que es el puerto mapeado al host para procesos
      # que corren fuera de Docker (mismo motivo que SUPABASE_JWKS_BASE_URL
      # arriba usa "kong" en vez de 127.0.0.1).
      SMTP_HOST: ${SMTP_HOST:-supabase_inbucket_supabase-stemhub}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-StemHub <no-reply@stemhub.app>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      INVITACION_DIAS_VENCIMIENTO: ${INVITACION_DIAS_VENCIMIENTO:-7}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Red que crea "npx supabase start" (nombre derivado de project_id en
    # Stem-Hub-BackEnd/supabase/config.toml). Necesaria para alcanzar "kong"
    # y descargar el JWKS del Supabase local.
    networks:
      - default
      - supabase_network_stemhub

  frontend:
    build:
      context: ./stemhub-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        # Debe apuntar al Supabase local (ver "npx supabase start" en
        # Stem-Hub-BackEnd), no a un servicio de este compose.
        VITE_GOTRUE_URL: ${VITE_GOTRUE_URL:-http://127.0.0.1:54321/auth/v1}
        # anon/public key fija de la Supabase CLI local (mismo valor en
        # cualquier instalación, no es secreta). GoTrue la exige en Supabase
        # Cloud; localmente no es estricta, pero se manda igual para no
        # divergir entre entornos.
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
    container_name: stemhub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

networks:
  supabase_network_stemhub:
    name: supabase_network_supabase-stemhub
    external: true

volumes:
  stemhub_postgres_data:
    name: stemhub_postgres_data
  stemhub_minio_data:
    name: stemhub_minio_data
  ml_tmp_data:
    name: ml_tmp_data
  ml_spleeter_models:
    name: ml_spleeter_models
