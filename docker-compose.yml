name: stemhub-system

services:

  postgres:
    image: postgres:17
    container_name: stemhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - stemhub_postgres_data:/var/lib/postgresql/data
      - ./Stem-Hub-BackEnd/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: stemhub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stemhub_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ml-spleeter-worker:
    build:
      context: ./stemhub-microservicio-IA/spleeter_worker
      dockerfile: Dockerfile
      # Para build con soporte GPU, descomentar:
      # args:
      #   BASE_IMAGE: tensorflow/tensorflow:2.5.0-gpu
    container_name: stemhub-ml-spleeter-worker
    restart: unless-stopped
    # Requiere driver NVIDIA propietario + nvidia-container-toolkit en el host,
    # y build con BASE_IMAGE=tensorflow/tensorflow:2.5.0-gpu (ver arriba).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ml_tmp_data:/shared-tmp
      - ml_spleeter_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ml-service:
    build:
      context: ./stemhub-microservicio-IA
      dockerfile: Dockerfile
    container_name: stemhub-ml-service
    restart: unless-stopped
    environment:
      APP_PORT: 8000
      SPLEETER_WORKER_URL: http://ml-spleeter-worker:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_API_BASE_URL: ${QWEN_API_BASE_URL}
      QWEN_MODEL: ${QWEN_MODEL:-qwen2.5-7b-instruct}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-stemhub-audio}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    volumes:
      - ml_tmp_data:/shared-tmp
    depends_on:
      ml-spleeter-worker:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./Stem-Hub-BackEnd
      dockerfile: Dockerfile
    container_name: stemhub-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./stemhub-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: stemhub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  stemhub_postgres_data:
    name: stemhub_postgres_data
  stemhub_minio_data:
    name: stemhub_minio_data
  ml_tmp_data:
    name: ml_tmp_data
  ml_spleeter_models:
    name: ml_spleeter_models
