name: stemhub-system

# Base común a dev y producción: servicios, redes, volúmenes y variables de
# entorno que no cambian entre entornos. Ningún servicio define "build:" ni
# "image:" acá — eso vive en docker-compose.override.yml (dev, aplicado
# automático) o docker-compose.prod.yml (prod, aplicado explícito con -f),
# para que este archivo nunca se pueda levantar solo por error.
#
# Dev:  docker compose up -d --build      (usa up.sh)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#         --env-file .env.production up -d   (usa deploy.sh)

services:

  postgres:
    image: postgres:17
    container_name: stemhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - stemhub_postgres_data:/var/lib/postgresql/data
      - ./Stem-Hub-BackEnd/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: stemhub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - stemhub_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ml-spleeter-worker:
    container_name: stemhub-ml-spleeter-worker
    restart: unless-stopped
    # Requiere driver NVIDIA propietario + nvidia-container-toolkit en el
    # host, y build/imagen con soporte GPU (ver spleeter_worker/Dockerfile).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ml_tmp_data:/shared-tmp
      - ml_spleeter_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ml-service:
    container_name: stemhub-ml-service
    restart: unless-stopped
    environment:
      APP_PORT: 8000
      SPLEETER_WORKER_URL: http://ml-spleeter-worker:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_API_BASE_URL: ${QWEN_API_BASE_URL}
      QWEN_MODEL: ${QWEN_MODEL:-qwen2.5-7b-instruct}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-stemhub-audio}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    volumes:
      - ml_tmp_data:/shared-tmp
    depends_on:
      ml-spleeter-worker:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    container_name: stemhub-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PORT: 8080
      SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54321}
      SUPABASE_AUDIENCE: ${SUPABASE_AUDIENCE:-authenticated}
      SUPABASE_JWKS_BASE_URL: ${SUPABASE_JWKS_BASE_URL:-http://kong:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Storage de audio, compartido con el bucket que ya usa ml-service.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-stemhub-audio}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      # Host con el que el NAVEGADOR (no el backend) resuelve las URLs
      # presignadas de descarga/reproducción de audio. MINIO_ENDPOINT
      # ("minio:9000") solo es resoluble dentro de la red de Docker.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
      # SMTP para el mail de invitación a proyecto, enviado directamente por
      # el backend Go (no pasa por GoTrue/auth.email.smtp).
      SMTP_HOST: ${SMTP_HOST:-supabase_inbucket_supabase-stemhub}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-StemHub <no-reply@stemhub.app>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      INVITACION_DIAS_VENCIMIENTO: ${INVITACION_DIAS_VENCIMIENTO:-7}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    container_name: stemhub-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  stemhub_postgres_data:
    name: stemhub_postgres_data
  stemhub_minio_data:
    name: stemhub_minio_data
  ml_tmp_data:
    name: ml_tmp_data
  ml_spleeter_models:
    name: ml_spleeter_models
