# Override de DESARROLLO — Docker Compose lo aplica automáticamente junto a
# docker-compose.yml en cualquier "docker compose ..." sin flags (por eso
# up.sh no necesita "-f" explícito). Agrega lo que sólo tiene sentido en un
# checkout local: build desde código fuente y la red que crea
# "npx supabase start" para alcanzar Kong (JWKS del Auth local).
#
# NO se aplica en producción — docker-compose.prod.yml se pasa en su lugar
# con "-f" explícito (ver deploy.sh), y jamás junto con este archivo.

services:

  ml-spleeter-worker:
    build:
      context: ./stemhub-microservicio-IA/spleeter_worker
      dockerfile: Dockerfile
      # Para build con soporte GPU, descomentar:
      # args:
      #   BASE_IMAGE: tensorflow/tensorflow:2.5.0-gpu

  ml-service:
    build:
      context: ./stemhub-microservicio-IA
      dockerfile: Dockerfile

  backend:
    build:
      context: ./Stem-Hub-BackEnd
      dockerfile: Dockerfile
    # Los defaults de SUPABASE_URL/SUPABASE_JWKS_BASE_URL/CORS_ALLOWED_ORIGINS/
    # MINIO_PUBLIC_ENDPOINT/SMTP_HOST/SMTP_PORT/FRONTEND_BASE_URL ya apuntan al
    # Supabase local en docker-compose.yml (base) — no hace falta repetirlos
    # acá salvo que se quiera sobreescribir un valor puntual en .env.
    #
    # SUPABASE_URL debe ser la URL pública que también usa el
    # navegador/frontend: es contra ese valor que se valida el claim "iss"
    # del token. La Supabase CLI local siempre emite tokens con
    # iss=http://127.0.0.1:54321 (no configurable), así que el JWKS se
    # descarga por un camino de red distinto (ver "networks" abajo) — ver
    # Stem-Hub-BackEnd/supabase/README.md para el detalle completo.
    #
    # Red que crea "npx supabase start" (nombre derivado de project_id en
    # Stem-Hub-BackEnd/supabase/config.toml). Necesaria para alcanzar "kong"
    # y descargar el JWKS del Supabase local. No existe en producción.
    networks:
      - default
      - supabase_network_stemhub

  frontend:
    build:
      context: ./stemhub-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        # Debe apuntar al Supabase local (ver "npx supabase start" en
        # Stem-Hub-BackEnd), no a un servicio de este compose.
        VITE_GOTRUE_URL: ${VITE_GOTRUE_URL:-http://127.0.0.1:54321/auth/v1}

networks:
  supabase_network_stemhub:
    name: supabase_network_supabase-stemhub
    external: true
